<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061b43">
<meta name="description" content="دليل صيدليات المناوبة في الدانا - إدلب">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/pharmacy.svg" type="image/svg+xml">
<title>صيدليات المناوبة في الدانا</title>
<style>
:root{--navy:#061b43;--navy2:#09285b;--gold:#f4bd35;--gold2:#ffe28a;--paper:#edf3ff;--ink:#071d49;--green:#12a34a;--red:#df242d;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(#dbe8fb,#f7f9ff 40%,#e5edfa);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
.hero{position:relative;overflow:hidden;color:white;padding:18px 15px 25px;background:radial-gradient(ellipse at 90% 15%,#23558a 0,transparent 35%),linear-gradient(115deg,#031333,#09285b 65%,#061b43);border-bottom:5px solid var(--gold);box-shadow:0 8px 25px #071d4933}.hero:after{content:"";position:absolute;inset:auto -8% -75px -8%;height:105px;border:2px solid #f6cb54;border-radius:50%;box-shadow:0 -5px 18px #eabf4a55;pointer-events:none}.wrap{max-width:1000px;margin:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brandmark{width:84px;height:76px;flex:none;display:grid;place-items:center;color:var(--gold2);filter:drop-shadow(0 0 8px #f7cb63aa)}.brandmark svg{width:100%;height:100%}.brand h1{font-size:clamp(22px,5vw,36px);margin:0;color:#ffe18a;text-shadow:0 3px 0 #8b5b0b,0 0 13px #ffdc6d66;line-height:1.4}.brand p{font-size:clamp(17px,3.5vw,27px);margin:0;color:#fff;font-weight:bold;text-shadow:0 2px 4px #000}.location{border:0;background:transparent;color:#fff;font-size:17px;font-weight:bold;white-space:nowrap;display:flex;align-items:center;gap:7px}.location span{font-size:28px}.searchbar{display:flex;gap:8px;margin:15px 2px 0;background:#ffffff18;border:1px solid #ffffff40;border-radius:15px;padding:5px}.searchbar input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:9px;font-size:14px}.searchbar input::placeholder{color:#d4deef}.searchbar button{border:0;border-radius:11px;background:linear-gradient(#ffe89c,#e7a91e);color:#392600;padding:0 17px;font-weight:bold}
main{max-width:1000px;margin:0 auto;padding:15px 13px 105px}.ad-wrap{margin:0 0 16px}.ad-banner{position:relative;overflow:hidden;min-height:180px;border:4px solid #e8b83d;border-radius:28px;background:radial-gradient(circle at 70% 40%,#1974bd,#082a62 60%,#031638);box-shadow:0 8px 18px #09285b35;color:#fff;display:flex;align-items:center;padding:20px 23px;isolation:isolate}.ad-banner:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#00143877,transparent 75%);z-index:-1}.ad-copy{position:relative;z-index:2;max-width:72%}.ad-copy small{color:#ffe08a;font-size:13px}.ad-copy h3{font-size:clamp(25px,5vw,39px);line-height:1.45;margin:5px 0;color:#ffce43;text-shadow:0 3px 3px #523800}.ad-copy p{font-size:clamp(16px,3vw,23px);font-weight:bold;color:white;margin:0;line-height:1.7}.ad-art{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:155px;height:145px;display:grid;place-items:center;color:#fff;font-size:80px;text-shadow:0 0 18px #41caff}.ad-dots{display:flex;justify-content:center;gap:9px;margin-top:8px}.ad-dots i{width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #25395c55}.ad-dots i.on{background:#f7bd31}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:3px 5px 18px}.filters button{min-height:65px;border:2px solid #ffffff;border-radius:28px;color:white;font-size:clamp(17px,4vw,25px);font-weight:bold;text-shadow:0 2px 3px #0005;box-shadow:0 4px 7px #10264a33;display:flex;justify-content:center;align-items:center;gap:8px}.filters button[data-filter="on_duty"]{background:linear-gradient(#ffe88b,#e9a91d);color:#3d2600;text-shadow:none;border-color:#e0a322}.filters button[data-filter="closed"]{background:linear-gradient(#ff7373,#d90014);border-color:#e9a0a0}.filters button[data-filter="open"]{background:linear-gradient(#59dc71,#008d35);border-color:#9ce3a7}.filters button.active{outline:3px solid #082451;outline-offset:2px;filter:saturate(1.13)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:3px 4px 12px}.section-head h2{font-size:21px;margin:0;color:var(--navy)}.section-head p{margin:5px 0 0;color:#687894;font-size:12px}.counter{color:#956b16;font-size:13px;font-weight:bold;white-space:nowrap}
#list{display:grid;gap:15px}.pharmacy{background:linear-gradient(145deg,#fff,#f4f7ff);border:1px solid #c8d2e4;border-radius:28px;overflow:hidden;box-shadow:0 6px 16px #09285b24;padding:12px}.card-main{display:flex;gap:15px;padding:5px 5px 13px;align-items:center}.photo{width:43%;max-width:260px;height:210px;flex:none;object-fit:cover;border-radius:21px;background:linear-gradient(145deg,#e6e9ef,#f8f8fa);box-shadow:0 3px 8px #10264a22}.details{flex:1;min-width:0;padding:2px 0}.name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:7px;flex-wrap:wrap}.details h3{font-size:clamp(19px,4vw,29px);color:var(--navy);margin:2px 0 12px;line-height:1.5}.status{font-size:12px;padding:7px 11px;border-radius:20px;white-space:nowrap;font-weight:bold}.status.open{background:#e0f7e7;color:#087a31}.status.closed{background:#ffe4e5;color:#ba101c}.status.duty{background:#fff0c4;color:#8b5d00}.meta{display:flex;gap:8px;align-items:flex-start;color:#132b58;font-size:clamp(14px,2.7vw,20px);font-weight:bold;line-height:1.8;margin:5px 0}.meta .pin{font-size:23px;color:#174b96}.pharmacist{font-size:clamp(14px,2.5vw,19px);color:#132b58;font-weight:bold;margin-top:12px}.card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid #e0e6f1;padding:11px 3px 2px}.action{display:flex;justify-content:center;align-items:center;gap:6px;text-align:center;text-decoration:none;border:1px solid #8da7cc;border-radius:19px;padding:12px 6px;font-size:clamp(12px,2.5vw,17px);font-weight:bold;min-height:66px;box-shadow:0 3px 7px #10264a22}.action.map,.action.gps{background:linear-gradient(#087bd0,#032d68);color:white}.action.update{background:linear-gradient(#ffe88b,#e7a51b);color:#382600;border-color:#dba328}.action.call{background:#e7f6ed;color:#176d42}.action.disabled{background:#edf0f6;color:#929bad;pointer-events:none}.empty{background:#fff;border:1px dashed #aab9d1;border-radius:20px;padding:30px 15px;text-align:center;color:#657590;font-size:13px;line-height:2}.empty b{display:block;color:var(--navy);font-size:16px;margin-bottom:5px}
footer{text-align:center;color:#75839c;font-size:11px;padding:20px 10px 28px}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(110deg,#031333,#09285b,#031333);border-top:3px solid #e8b83d;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -6px 20px #071d4933}.bottomnav a{color:#fff;text-decoration:none;text-align:center;font-size:11px;font-weight:bold;display:flex;flex-direction:column;align-items:center;gap:3px;border-left:1px solid #ffffff24}.bottomnav a:last-child{border:0}.bottomnav .ico{font-size:25px;line-height:1.3}.bottomnav a.active{color:#ffda72;text-shadow:0 0 9px #ffc63f}.bottomnav a.active .ico{font-size:31px}
@media(max-width:540px){.hero{padding:13px 11px 21px}.brandmark{width:66px;height:64px}.location{font-size:14px}.ad-banner{min-height:154px;padding:15px}.ad-art{width:110px;font-size:62px}.filters{gap:7px;padding-inline:0}.filters button{min-height:58px;border-radius:23px}.pharmacy{padding:8px;border-radius:22px}.card-main{gap:10px;padding:3px 2px 10px}.photo{height:150px;width:40%;border-radius:16px}.details h3{margin-bottom:6px}.card-actions{gap:5px}.action{min-height:58px;padding:8px 3px;border-radius:14px}.bottomnav .ico{font-size:22px}.bottomnav a{font-size:10px}}
@media(min-width:700px){#list{grid-template-columns:1fr 1fr}.pharmacy{min-width:0}.photo{height:180px}}
</style>
</head>
<body>
<header class="hero" id="home"><div class="wrap">
<div class="topline"><div class="brand"><div class="brandmark" aria-label="شعار النسر"><svg viewBox="0 0 120 90" fill="none" aria-hidden="true"><path d="M58 35C43 8 17 5 3 9c14 8 18 18 20 28C11 29 6 30 1 32c14 10 22 21 37 24 6 2 12 1 18-3-8 15-20 21-34 24 23 7 41-1 48-16 7 15 25 23 48 16-14-4-26-13-34-25 7 4 13 4 20 1 14-6 22-16 35-25-9 1-15 2-22 6 3-11 9-20 20-29-20-2-39 8-53 30l-7 9-19-9Z" fill="currentColor"/><path d="M57 35 69 49 82 31 70 53 60 59 50 53Z" fill="#fff0b7"/><path d="m61 55 12 8-12 17-12-17Z" fill="#e7ad27"/></svg></div><div><h1>صيدليات المناوبة</h1><p>في الدانا</p></div></div><div class="location">الدانا <span>📍</span></div></div>
<div class="searchbar"><input id="search" placeholder="ابحث عن اسم الصيدلية أو المنطقة..." aria-label="بحث"><button id="searchBtn">بحث</button></div>
</div></header>
<main>
<section class="ad-wrap" id="ads"><div id="adBanner" class="ad-banner"><div class="ad-copy"><small>صحتك تهمنا</small><h3>صحتك تهمنا</h3><p>معاً .. لمدينة أكثر صحة</p></div><div class="ad-art">♡</div></div><div id="adDots" class="ad-dots"></div></section>
<div class="filters" role="group" aria-label="تصفية الصيدليات"><button class="active" data-filter="on_duty">مناوبة ★</button><button data-filter="closed">مغلقة ▣</button><button data-filter="open">مفتوحة ◷</button></div>
<div class="section-head" id="all"><div><h2>جميع الصيدليات</h2><p>صيدليات الدانا – إدلب</p></div><span class="counter" id="count">جارٍ التحميل…</span></div>
<section id="list"><div class="empty">يتم تحميل الصيدليات…</div></section>
<footer id="about">صيدليات المناوبة في الدانا • دليل صحي لخدمة المجتمع</footer>
</main>
<nav class="bottomnav" aria-label="التنقل الرئيسي"><a href="#about"><span class="ico">ⓘ</span>حول التطبيق</a><a href="#ads"><span class="ico">♟</span>الإعلانات</a><a class="active" href="#home"><span class="ico">⌂</span>الرئيسية</a><a href="#all" id="allNav"><span class="ico">☷</span>جميع الصيدليات</a><a href="/admin.html"><span class="ico">⚙</span>الإعدادات</a></nav>
<script>
const SUPABASE_URL="https://okffadfszrsbxhtevsln.supabase.co";
const SUPABASE_KEY="sb_publishable_9dIG9P1q4ns-Kt4axjD5sw_Bu4bJ9LX";
function getVisitorId(){const key="pharmacy_directory_visitor_id";try{let id=localStorage.getItem(key);if(!id){id=(crypto&&crypto.randomUUID)?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16);});localStorage.setItem(key,id);}return id;}catch(e){return null;}}
const visitorId=getVisitorId();
async function trackVisit(){if(!visitorId)return;try{await fetch(SUPABASE_URL+"/rest/v1/rpc/track_public_visit",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_visitor_id:visitorId}),keepalive:true});}catch(e){console.warn("Visit tracking unavailable",e);}}
trackVisit();setInterval(()=>{if(document.visibilityState==="visible")trackVisit();},60000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")trackVisit();});
const list=document.querySelector("#list"),search=document.querySelector("#search"),count=document.querySelector("#count");
let pharmacies=[],ads=[],filter="on_duty",adIndex=0,adTimer=null;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function stateOf(p){const s=String(p.status||"").toLowerCase().trim();if(["on_duty","duty","مناوبة","مناوب","نوبة"].includes(s)||s.includes("duty"))return "on_duty";if(["closed","مغلقة","مغلق"].includes(s)||s.includes("closed"))return "closed";if(["open","مفتوحة","مفتوح"].includes(s)||s.includes("open"))return "open";return "unknown";}
function stateLabel(s){return s==="on_duty"?"مناوبة":s==="open"?"مفتوحة":s==="closed"?"مغلقة":"غير محددة";}
function mapUrl(p){if(p.latitude!=null&&p.longitude!=null)return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(p.latitude+","+p.longitude);return "";}
function render(){const q=search.value.trim().toLowerCase();const rows=pharmacies.filter(p=>{const s=stateOf(p),hay=[p.name,p.address,p.pharmacist_name].join(" ").toLowerCase();return(!q||hay.includes(q))&&(filter==="all"||s===filter);});rows.sort((a,b)=>({on_duty:0,open:1,closed:2,unknown:3}[stateOf(a)]-{on_duty:0,open:1,closed:2,unknown:3}[stateOf(b)]));count.textContent=rows.length+" صيدلية";list.innerHTML=rows.length?rows.map(p=>{const s=stateOf(p),m=mapUrl(p),phone=String(p.phone||"").replace(/[^+0-9]/g,"");const image=p.image_url?'<img class="photo" src="'+esc(p.image_url)+'" alt="'+esc(p.name||"صورة الصيدلية")+'" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="photo" style="display:grid;place-items:center;color:#b18b48;font-size:55px">✚</div>';const gps=m?'<a class="action gps" href="'+m+'" target="_blank" rel="noopener">➤ تحديد الموقع<br>(GPS)</a>':'<span class="action disabled">الموقع غير متوفر</span>';const map=m?'<a class="action map" href="'+m+'" target="_blank" rel="noopener">▣ عرض الموقع<br>على الخريطة</a>':'<span class="action disabled">لا يوجد موقع</span>';const update='<a class="action update" href="/admin.html">✎ تحديث<br>المعلومات</a>';return '<article class="pharmacy"><div class="card-main">'+image+'<div class="details"><div class="name-row"><h3>'+esc(p.name||"صيدلية")+'</h3><span class="status '+(s==="on_duty"?"duty":s)+'">'+stateLabel(s)+'</span></div><p class="meta"><span class="pin">📍</span><span>'+esc(p.address||"العنوان غير محدد")+'</span></p>'+(p.pharmacist_name?'<div class="pharmacist">♟ '+esc(p.pharmacist_name)+'</div>':'')+'</div></div><div class="card-actions">'+map+gps+update+'</div>'+(phone?'<a class="action call" style="margin-top:8px" href="tel:'+esc(phone)+'">☎ اتصال بالصيدلية</a>':'')+'</article>';}).join(""):'<div class="empty"><b>لا توجد صيدليات بهذه الحالة</b>جرّب اختيار حالة أخرى أو تعديل كلمة البحث.</div>';}
function renderAds(){const box=document.querySelector("#adBanner"),dots=document.querySelector("#adDots");if(!ads.length){dots.innerHTML="";return;}const a=ads[adIndex%ads.length];box.innerHTML='<div class="ad-copy"><small>إعلان مميز</small><h3>'+esc(a.title||"إعلان")+'</h3><p>'+esc(a.description||"")+'</p></div>'+(a.image_url?'<img src="'+esc(a.image_url)+'" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2" onerror="this.remove()">':'<div class="ad-art">✦</div>');box.style.cursor=a.target_url?"pointer":"default";box.onclick=()=>{if(a.target_url)window.open(a.target_url,"_blank","noopener");};dots.innerHTML=ads.map((_,i)=>'<i class="'+(i===adIndex?"on":"")+'"></i>').join("");if(adTimer)clearInterval(adTimer);if(ads.length>1)adTimer=setInterval(()=>{adIndex=(adIndex+1)%ads.length;renderAds();},5000);}
async function getRows(path){const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});if(!r.ok)throw new Error("تعذر جلب البيانات ("+r.status+")");return r.json();}
async function load(){try{pharmacies=await getRows("public_pharmacies?select=*");render();}catch(e){count.textContent="تعذر التحميل";list.innerHTML='<div class="empty"><b>تعذر تحميل الصيدليات</b>'+esc(e.message)+'</div>';}try{const now=new Date().toISOString();ads=await getRows("public_advertisements?select=*&order=starts_at.asc");ads=ads.filter(a=>(!a.starts_at||a.starts_at<=now)&&(!a.ends_at||a.ends_at>=now));renderAds();}catch(e){console.warn("Ads unavailable",e);}}
document.querySelectorAll(".filters button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render();}));
search.addEventListener("input",render);document.querySelector("#searchBtn").addEventListener("click",render);document.querySelector("#allNav").addEventListener("click",()=>{filter="all";document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));render();});
document.querySelectorAll(".bottomnav a").forEach(a=>a.addEventListener("click",()=>{document.querySelectorAll(".bottomnav a").forEach(x=>x.classList.remove("active"));a.classList.add("active");}));
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(console.error));
load();
</script>
</body></html>
